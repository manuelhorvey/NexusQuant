services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "5432:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    environment:
      # Points the API at the Postgres service (SQLite is the local fallback).
      NEXUS_DATABASE_URL: postgresql+psycopg://nexus:nexus@db:5432/nexus
    ports:
      - "8000:8000"
    volumes:
      # Live data + models: bind-mounted so MT5 backfills show up instantly.
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  nexus_pgdata:
